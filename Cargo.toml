[package]
name = "murali"
version = "0.2.6"
edition = "2024"
rust-version = "1.85"
description = "A Rust animation engine for programmatic, timeline-driven mathematical, AI, and explainer visuals."
license = "MIT OR Apache-2.0"
repository = "https://github.com/murali-engine/murali"
homepage = "https://muraliengine.com"
documentation = "https://muraliengine.com"
readme = "README.md"
keywords = ["animation", "graphics", "math", "visualization", "manim"]
categories = ["graphics", "rendering"]
exclude = [
  "docs/**",
  "examples/**",
  "scripts/**",
  "optimization/**",
  ".github/**",
  "render_output/**",
  "rendered_output/**",
  "Cargo.toml.orig",
  "preview_all.sh",
  "export_all.sh",
  "RELEASE.md"
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["typst_embedded"]
experimental = []
python = ["dep:pyo3"]
typst_embedded = ["dep:typst", "dep:typst-as-lib", "dep:typst-svg"]

[dependencies]
winit = "0.30"
wgpu = "26.0.1"
env_logger = "0.11"
glam = { version = "0.33", features = ["bytemuck"] }
tracing = "0.1"
anyhow = "1"
# bytemuck = "1.14"
pollster = "1"
tokio = { version = "1", features = [
  "rt",
  "macros",
  "full",
] }
typst = { version = "0.13.1", optional = true } # version may vary; required for embedded Typst
typst-as-lib = { version = "0.13", optional = true, features = ["typst-kit-fonts", "typst-kit-embed-fonts"] } # optional helper; pick actual maintained wrapper
typst-svg = { version = "0.13.1", optional = true } # if available; otherwise use typst APIs
typst-kit = "0.13.1"
lru = "0.18"
sha2 = "0.11"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2"
toml = "1.1"
twox-hash = "2.1.2"
image = "=0.25.9"
gltf = { version = "1.4", features = ["import"] }
bytemuck = { version = "1.25", features = ["derive"] }
usvg = "0.48.1"
resvg = "0.48.1"
tiny-skia = "0.12"
lyon_tessellation = "1.0.20"
ttf-parser = "0.25.1"
thiserror = "2"

# font rendering
fontdue = "0.9"
hecs = "0.11"
pyo3 = { version = "0.25", optional = true, features = ["abi3-py310", "extension-module"] }

# typst-kit depends on native-tls/openssl on Linux. Vendoring avoids a libssl
# wheel dependency, which manylinux/PyPI would reject.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
naga = { version = "26", features = ["wgsl-in"] }
proptest = "1"

[[example]]
name = "linear_algebra_basis_change"
required-features = ["experimental"]

[[example]]
name = "linear_algebra_column_combination"
required-features = ["experimental"]

[[example]]
name = "linear_algebra_composition"
required-features = ["experimental"]

[[example]]
name = "linear_algebra_transform_order_scene_view"
required-features = ["experimental"]

[[example]]
name = "linear_algebra_determinant"
required-features = ["experimental"]

[[example]]
name = "linear_algebra_dot_product"
required-features = ["experimental"]

[[example]]
name = "linear_algebra_matrix_transform"
required-features = ["experimental"]

[[example]]
name = "linear_algebra_matrix_vector"
required-features = ["experimental"]

[[example]]
name = "linear_algebra_span"
required-features = ["experimental"]

[[example]]
name = "linear_algebra_vectors"
required-features = ["experimental"]
