[package]
name = "murali"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "A Rust animation engine for programmatic, timeline-driven mathematical, AI, and explainer visuals."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ravishankarkumar/murali"
homepage = "https://muraliengine.com"
documentation = "https://muraliengine.com"
readme = "README.md"
keywords = ["animation", "graphics", "math", "visualization", "manim"]
categories = ["graphics", "rendering"]

exclude = [
  "docs/**",
  "examples/**",
  "scripts/**",
  "optimization/**",
  ".github/**",
  "render_output/**",
  "rendered_output/**",
  "Cargo.toml.orig",
  "preview_all.sh",
  "export_all.sh",
  "RELEASE.md"
]

[features]
default = ["typst_embedded"]
typst_embedded = ["dep:typst", "dep:typst-as-lib", "dep:typst-svg"]

[dependencies]
winit = "0.30"
wgpu = "26.0.1"
env_logger = "0.11"
glam = { version = "0.33", features = ["bytemuck"] }
tracing = "0.1"
anyhow = "1"
# bytemuck = "1.14"
pollster = "1"
tokio = { version = "1", features = [
  "rt",
  "macros",
  "full",
] }
typst = { version = "0.13.1", optional = true } # version may vary; required for embedded Typst
typst-as-lib = { version = "0.13", optional = true, features = ["typst-kit-fonts", "typst-kit-embed-fonts"] } # optional helper; pick actual maintained wrapper
typst-svg = { version = "0.13.1", optional = true } # if available; otherwise use typst APIs
typst-kit = "0.13.1"
lru = "0.18"
sha2 = "0.11"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2"
toml = "1.1"
twox-hash = "2.1.2"
image = "=0.25.9"
gltf = { version = "1.4", features = ["import"] }
bytemuck = { version = "1.25", features = ["derive"] }
usvg = "0.48.1"
resvg = "0.48.1"
tiny-skia = "0.12"
lyon_tessellation = "1.0.20"
ttf-parser = "0.25.1"
thiserror = "2"

# font rendering
fontdue = "0.9"
hecs = "0.11"

[dev-dependencies]
naga = { version = "26", features = ["wgsl-in"] }
proptest = "1"
